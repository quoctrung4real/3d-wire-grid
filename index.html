<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive 3D Wire Grid Simulation - Push, pull, and tear a realistic metal wire mesh">
    <title>3D Wire Grid Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            cursor: crosshair;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        #title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        #instructions {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        .fade-out {
            opacity: 0 !important;
        }

        #stats {
            position: fixed;
            bottom: 20px;
            right: 24px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 1px;
            z-index: 10;
            text-align: right;
            line-height: 1.6;
        }

        #mode-indicator {
            position: fixed;
            bottom: 20px;
            left: 24px;
            z-index: 10;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="title">Interactive Wire Grid</div>
        <div id="instructions">Click & drag to deform · Drag down to push · Drag up to pull · Pull hard to tear</div>
    </div>
    <div id="stats">
        <div id="stat-springs"></div>
        <div id="stat-torn"></div>
        <div id="stat-fps"></div>
    </div>
    <div id="mode-indicator">
        <button class="mode-btn active" id="btn-push" onclick="setMode('push')">Push / Pull</button>
        <button class="mode-btn" id="btn-grab" onclick="setMode('grab')">Grab</button>
        <button class="mode-btn" id="btn-reset" onclick="resetGrid()">Reset</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
    // ============================================================
    // 3D INTERACTIVE WIRE GRID — ULTRA-FINE MESH
    // High-fidelity spring-mass with substep Verlet integration
    // ============================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- Configuration ---
    const CONFIG = {
        // Grid — 1/4 cell size (spacing ~5.5px), cover screen
        spacing: 5.5,
        
        // Physics — tuned for ultra-fine mesh
        gravity: 0.02,
        damping: 0.993,
        stiffness: 0.6,
        shearStiffness: 0.3,
        tearDistance: 3.2,
        substeps: 4,            // physics substeps per frame
        constraintIters: 6,     // constraint solver iterations per substep
        zRestoreForce: 0.008,   // restoring force toward original Z
        
        // Mouse
        mouseRadius: 100,
        mouseStrength: 0.8,
        
        // 3D perspective
        perspective: 900,
        cameraZ: -500,
        
        // Rendering
        lineAlpha: 0.4,
        dotRadius: 0.6,
        dotAlpha: 0.5,
        
        // Performance — skip rendering every Nth spring for diagonals
        renderSkipDiag: 2,
    };

    let width, height, cols, rows;
    let particles = [];
    let springs = [];
    let mouse = { x: 0, y: 0, px: 0, py: 0, down: false, button: 0 };
    let mode = 'push';
    let grabbedParticle = null;
    let tornCount = 0;
    let totalSprings = 0;
    let animationId;
    let frameCount = 0;
    let lastFPSTime = performance.now();
    let displayFPS = 60;

    // Pre-computed projection cache
    let projCache = null;

    // --- Resize ---
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // --- Particle ---
    class Particle {
        constructor(x, y, z, pinned = false) {
            this.x = x;
            this.y = y;
            this.z = z;
            this.ox = x;
            this.oy = y;
            this.oz = z;
            this.px = x;
            this.py = y;
            this.pz = z;
            this.pinned = pinned;
            this.idx = 0; // will be set after creation
        }

        update() {
            if (this.pinned) return;

            // Verlet integration
            let vx = (this.x - this.px) * CONFIG.damping;
            let vy = (this.y - this.py) * CONFIG.damping;
            let vz = (this.z - this.pz) * CONFIG.damping;

            this.px = this.x;
            this.py = this.y;
            this.pz = this.z;

            this.x += vx;
            this.y += vy + CONFIG.gravity;
            this.z += vz;

            // Clamp Z
            if (this.z < -400) this.z = -400;
            if (this.z > 400) this.z = 400;

            // Restore Z toward original
            this.z += (this.oz - this.z) * CONFIG.zRestoreForce;
        }

        // Project 3D to 2D (cached per frame)
        project() {
            const rawScale = CONFIG.perspective / (CONFIG.perspective - this.z + CONFIG.cameraZ);
            const scale = rawScale < 0.1 ? 0.1 : (rawScale > 3.0 ? 3.0 : rawScale);
            return {
                x: width * 0.5 + (this.x - width * 0.5) * scale,
                y: height * 0.5 + (this.y - height * 0.5) * scale,
                scale: scale
            };
        }
    }

    // --- Spring ---
    class Spring {
        constructor(a, b, stiffness, isDiag) {
            this.a = a;
            this.b = b;
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dz = a.z - b.z;
            this.restLength = Math.sqrt(dx * dx + dy * dy + dz * dz);
            this.stiffness = stiffness;
            this.torn = false;
            this.tearProgress = 0;
            this.isDiag = isDiag; // for rendering priority
        }

        solve() {
            if (this.torn) return;

            const dx = this.b.x - this.a.x;
            const dy = this.b.y - this.a.y;
            const dz = this.b.z - this.a.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            
            if (distSq < 0.0001) return;
            
            const dist = Math.sqrt(distSq);
            const stretchRatio = dist / this.restLength;

            // Tear progress for visual feedback
            if (stretchRatio > 1.5) {
                this.tearProgress = (stretchRatio - 1.5) / (CONFIG.tearDistance - 1.5);
                if (this.tearProgress < 0) this.tearProgress = 0;
                if (this.tearProgress > 1) this.tearProgress = 1;
            } else {
                this.tearProgress = 0;
            }

            if (stretchRatio > CONFIG.tearDistance) {
                this.torn = true;
                tornCount++;
                return;
            }

            const diff = (dist - this.restLength) / dist;
            const stiff = this.stiffness * 0.5;
            const ox = dx * diff * stiff;
            const oy = dy * diff * stiff;
            const oz = dz * diff * stiff;

            if (!this.a.pinned) {
                this.a.x += ox;
                this.a.y += oy;
                this.a.z += oz;
            }
            if (!this.b.pinned) {
                this.b.x -= ox;
                this.b.y -= oy;
                this.b.z -= oz;
            }
        }
    }

    // --- Initialize Grid ---
    function initGrid() {
        particles = [];
        springs = [];
        tornCount = 0;

        // Calculate cols/rows to fill viewport
        cols = Math.floor(width / CONFIG.spacing) + 1;
        rows = Math.floor(height / CONFIG.spacing) + 1;
        
        // Limit for performance — cap total particles
        const maxParticles = 80000;
        if (cols * rows > maxParticles) {
            const ratio = Math.sqrt(maxParticles / (cols * rows));
            cols = Math.floor(cols * ratio);
            rows = Math.floor(rows * ratio);
        }

        const startX = (width - (cols - 1) * CONFIG.spacing) / 2;
        const startY = (height - (rows - 1) * CONFIG.spacing) / 2;

        // Create particles
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const x = startX + col * CONFIG.spacing;
                const y = startY + row * CONFIG.spacing;
                const pinned = row === 0;
                const p = new Particle(x, y, 0, pinned);
                p.idx = particles.length;
                particles.push(p);
            }
        }

        // Create springs — structural (horizontal + vertical) + shear (diagonal)
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const idx = row * cols + col;
                
                // Right neighbor — structural
                if (col < cols - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + 1], CONFIG.stiffness, false));
                }
                // Bottom neighbor — structural
                if (row < rows - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + cols], CONFIG.stiffness, false));
                }
                // Diagonal (bottom-right) — shear
                if (col < cols - 1 && row < rows - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + cols + 1], CONFIG.shearStiffness, true));
                }
                // Diagonal (bottom-left) — shear
                if (col > 0 && row < rows - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + cols - 1], CONFIG.shearStiffness, true));
                }
            }
        }

        totalSprings = springs.length;
        projCache = new Array(particles.length);
        
        console.log(`Grid: ${cols}x${rows} = ${particles.length} particles, ${springs.length} springs`);
    }

    // --- Mouse Interaction ---
    function applyMouseForce() {
        if (!mouse.down) return;

        const mouseDx = mouse.x - mouse.px;
        const mouseDy = mouse.y - mouse.py;

        if (mode === 'grab' && grabbedParticle) {
            const p = grabbedParticle;
            if (!p.pinned) {
                p.x = mouse.x;
                p.y = mouse.y;
            }
            return;
        }

        // Push/Pull mode — use spatial locality for performance
        const radiusSq = CONFIG.mouseRadius * CONFIG.mouseRadius;
        const invRadius = 1.0 / CONFIG.mouseRadius;
        
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (p.pinned) continue;

            // Quick approximate screen check before full projection
            const approxDx = p.x - mouse.x;
            const approxDy = p.y - mouse.y;
            const approxDistSq = approxDx * approxDx + approxDy * approxDy;
            
            // Allow a generous margin for Z-projected positions
            if (approxDistSq > radiusSq * 4) continue;

            const proj = p.project();
            const dx = proj.x - mouse.x;
            const dy = proj.y - mouse.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < radiusSq) {
                const dist = Math.sqrt(distSq);
                const force = (1 - dist * invRadius) * CONFIG.mouseStrength;

                // Smooth cubic falloff for more natural feel
                const t = 1 - dist * invRadius;
                const smoothForce = t * t * (3 - 2 * t) * CONFIG.mouseStrength;

                p.x += mouseDx * smoothForce * 0.4;
                p.y += mouseDy * smoothForce * 0.4;

                // Z-axis push/pull
                p.z += mouseDy * smoothForce * 1.5;
            }
        }
    }

    // --- Find nearest particle ---
    function findNearestParticle(mx, my) {
        let nearest = null;
        let nearestDist = Infinity;

        for (const p of particles) {
            const proj = p.project();
            const dx = proj.x - mx;
            const dy = proj.y - my;
            const dist = dx * dx + dy * dy;
            if (dist < nearestDist && dist < 900) {
                nearestDist = dist;
                nearest = p;
            }
        }
        return nearest;
    }

    // --- Physics Step with substeps ---
    function physicsStep() {
        for (let sub = 0; sub < CONFIG.substeps; sub++) {
            // Constraint solver — multiple iterations for stability
            for (let iter = 0; iter < CONFIG.constraintIters; iter++) {
                for (let i = 0; i < springs.length; i++) {
                    springs[i].solve();
                }
            }
            
            // Integrate particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
        }

        // Apply mouse force once per frame
        applyMouseForce();
    }

    // --- Rendering ---
    // Pre-compute all projections once per frame
    function computeProjections() {
        for (let i = 0; i < particles.length; i++) {
            projCache[i] = particles[i].project();
        }
    }

    function render() {
        ctx.clearRect(0, 0, width, height);

        // Background
        const grad = ctx.createRadialGradient(width * 0.5, height * 0.5, 0, width * 0.5, height * 0.5, Math.max(width, height) * 0.7);
        grad.addColorStop(0, '#080810');
        grad.addColorStop(0.5, '#050508');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Compute projections
        computeProjections();

        // --- Draw springs (lines) ---
        // Batch by approximate color to reduce state changes
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Draw structural springs only (skip diagonals for clean wire grid look)
        for (let i = 0; i < springs.length; i++) {
            const s = springs[i];
            if (s.torn) continue;
            if (s.isDiag) continue; // Don't render diagonals — they're structural only

            const aIdx = s.a.idx;
            const bIdx = s.b.idx;
            const a = projCache[aIdx];
            const b = projCache[bIdx];

            // Quick frustum culling
            if (a.x < -20 && b.x < -20) continue;
            if (a.x > width + 20 && b.x > width + 20) continue;
            if (a.y < -20 && b.y < -20) continue;
            if (a.y > height + 20 && b.y > height + 20) continue;

            // Depth-based alpha
            const avgZ = (s.a.z + s.b.z) * 0.5;
            const depthFade = 1 - Math.abs(avgZ) * 0.0025;
            const dFade = depthFade < 0.08 ? 0.08 : (depthFade > 1 ? 1 : depthFade);
            
            const minScale = a.scale < b.scale ? a.scale : b.scale;
            let alpha = CONFIG.lineAlpha * minScale * dFade;

            let r = 200, g = 210, bCol = 225; // Slight cool steel tone

            // Stretch coloring
            if (s.tearProgress > 0) {
                r = 255;
                g = Math.floor(200 * (1 - s.tearProgress * 0.85));
                bCol = Math.floor(180 * (1 - s.tearProgress));
                alpha += s.tearProgress * 0.4;
            }

            // Depth-based color shift — closer = brighter, further = darker blue
            if (avgZ > 0) {
                // Coming toward camera
                const zBoost = avgZ * 0.001;
                r = Math.min(255, r + Math.floor(55 * zBoost));
                g = Math.min(255, g + Math.floor(45 * zBoost));
                bCol = Math.min(255, bCol + Math.floor(30 * zBoost));
            } else {
                // Going away
                const zDim = Math.abs(avgZ) * 0.001;
                r = Math.max(80, r - Math.floor(80 * zDim));
                g = Math.max(90, g - Math.floor(70 * zDim));
                bCol = Math.max(120, bCol - Math.floor(40 * zDim));
            }

            if (alpha < 0.02) continue;
            if (alpha > 0.9) alpha = 0.9;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(${r},${g},${bCol},${alpha.toFixed(3)})`;
            ctx.lineWidth = 0.4 * minScale;
            if (ctx.lineWidth < 0.15) ctx.lineWidth = 0.15;
            if (ctx.lineWidth > 1.8) ctx.lineWidth = 1.8;
            ctx.stroke();
        }

        // --- Draw intersection dots (every Nth for performance) ---
        const dotStep = 4; // Draw every 4th node for performance
        for (let row = 0; row < rows; row += dotStep) {
            for (let col = 0; col < cols; col += dotStep) {
                const i = row * cols + col;
                if (i >= particles.length) continue;
                
                const p = particles[i];
                const proj = projCache[i];

                if (proj.x < -30 || proj.x > width + 30 || proj.y < -30 || proj.y > height + 30) continue;

                const depthFade = 1 - Math.abs(p.z) * 0.0025;
                const dFade = depthFade < 0.08 ? 0.08 : depthFade;
                let alpha = CONFIG.dotAlpha * proj.scale * dFade;

                let radius = CONFIG.dotRadius * proj.scale;
                let color = '200, 210, 225';

                if (p.pinned) {
                    color = '100, 180, 255';
                    alpha *= 1.5;
                    if (alpha > 1) alpha = 1;
                    radius *= 1.3;
                }

                // Near-mouse highlight
                if (mouse.down) {
                    const dx = proj.x - mouse.x;
                    const dy = proj.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.mouseRadius) {
                        const influence = 1 - dist / CONFIG.mouseRadius;
                        const smoothInf = influence * influence * (3 - 2 * influence);
                        alpha += smoothInf * 0.4;
                        if (alpha > 1) alpha = 1;
                        radius += smoothInf * 1.5;

                        // Subtle glow
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, radius * 4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(100, 200, 255, ${smoothInf * 0.05})`;
                        ctx.fill();
                    }
                }

                ctx.beginPath();
                ctx.arc(proj.x, proj.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color}, ${alpha.toFixed(3)})`;
                ctx.fill();
            }
        }

        // Mouse cursor glow
        if (mouse.down) {
            const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, CONFIG.mouseRadius);
            glow.addColorStop(0, 'rgba(80, 160, 255, 0.07)');
            glow.addColorStop(0.4, 'rgba(80, 160, 255, 0.03)');
            glow.addColorStop(1, 'rgba(80, 160, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, CONFIG.mouseRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastFPSTime >= 1000) {
            displayFPS = Math.round(frameCount * 1000 / (now - lastFPSTime));
            frameCount = 0;
            lastFPSTime = now;
        }

        // Update stats
        document.getElementById('stat-springs').textContent = `GRID: ${cols}×${rows}`;
        document.getElementById('stat-torn').textContent = `TORN: ${tornCount}`;
        document.getElementById('stat-fps').textContent = `FPS: ${displayFPS}`;
    }

    // --- Animation Loop ---
    function animate() {
        physicsStep();
        render();
        animationId = requestAnimationFrame(animate);
    }

    // --- Event Handlers ---
    canvas.addEventListener('mousedown', (e) => {
        mouse.down = true;
        mouse.button = e.button;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.px = e.clientX;
        mouse.py = e.clientY;

        if (mode === 'grab') {
            grabbedParticle = findNearestParticle(mouse.x, mouse.y);
        }

        document.getElementById('title').classList.add('fade-out');
        document.getElementById('instructions').classList.add('fade-out');
    });

    canvas.addEventListener('mousemove', (e) => {
        mouse.px = mouse.x;
        mouse.py = mouse.y;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    canvas.addEventListener('mouseup', () => {
        mouse.down = false;
        grabbedParticle = null;
    });

    canvas.addEventListener('mouseleave', () => {
        mouse.down = false;
        grabbedParticle = null;
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouse.down = true;
        mouse.x = touch.clientX;
        mouse.y = touch.clientY;
        mouse.px = touch.clientX;
        mouse.py = touch.clientY;

        if (mode === 'grab') {
            grabbedParticle = findNearestParticle(mouse.x, mouse.y);
        }

        document.getElementById('title').classList.add('fade-out');
        document.getElementById('instructions').classList.add('fade-out');
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouse.px = mouse.x;
        mouse.py = mouse.y;
        mouse.x = touch.clientX;
        mouse.y = touch.clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
        mouse.down = false;
        grabbedParticle = null;
    });

    // Scroll to adjust mouse radius
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        CONFIG.mouseRadius = Math.max(20, Math.min(300, CONFIG.mouseRadius - e.deltaY * 0.3));
    }, { passive: false });

    window.addEventListener('resize', () => {
        resize();
        initGrid();
    });

    // --- Mode control ---
    function setMode(m) {
        mode = m;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        if (m === 'push') document.getElementById('btn-push').classList.add('active');
        else if (m === 'grab') document.getElementById('btn-grab').classList.add('active');
    }

    function resetGrid() {
        initGrid();
    }

    // Make functions global
    window.setMode = setMode;
    window.resetGrid = resetGrid;

    // --- Init ---
    resize();
    initGrid();
    animate();
    </script>
</body>
</html>
