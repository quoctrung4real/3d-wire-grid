<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive 3D Wire Grid Simulation - Push, pull, and tear a realistic metal wire mesh">
    <title>3D Wire Grid Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #080810 0%, #050508 50%, #000000 100%);
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            cursor: crosshair;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2; /* place canvas over watermark */
        }

        #ui-overlay {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        #title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        #instructions {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        #watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5); /* slightly dimmer than title so it's a good watermark */
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 1; /* below canvas (which is z-index auto) */
            pointer-events: none;
            user-select: none;
        }

        .fade-out {
            opacity: 0 !important;
        }

        #stats {
            position: fixed;
            bottom: 20px;
            right: 24px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 1px;
            z-index: 10;
            text-align: right;
            line-height: 1.6;
        }

        #mode-indicator {
            position: fixed;
            bottom: 20px;
            left: 24px;
            z-index: 10;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="watermark">MADE BY QUOCTRUNG4REAL</div>
    <div id="ui-overlay">
        <div id="title">Interactive Wire Grid</div>
        <div id="instructions">Hover to push · Click & drag to grab · Drag hard to tear</div>
    </div>
    <div id="stats">
        <div id="stat-springs"></div>
        <div id="stat-torn"></div>
        <div id="stat-fps"></div>
    </div>
    <div id="mode-indicator">
        <button class="mode-btn" id="btn-reset" onclick="resetGrid()">Reset</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
    // ============================================================
    // 3D INTERACTIVE WIRE GRID — ULTRA-FINE MESH
    // High-fidelity spring-mass with substep Verlet integration
    // ============================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- Configuration ---
    const CONFIG = {
        // Grid — doubled from 5.5 to 11px
        spacing: 11,
        
        // Physics — balanced for performance + quality
        gravity: 0.03,
        damping: 0.991,
        stiffness: 0.55,
        shearStiffness: 0.25,
        tearDistance: 2.0,
        substeps: 2,            // physics substeps per frame
        constraintIters: 3,     // constraint solver iterations per substep
        zRestoreForce: 0.006,   // restoring force toward original Z
        
        // Mouse
        mouseRadius: 100,
        mouseStrength: 0.8,
        grabRadius: 20,         // max distance to grab a particle (px)
        
        // 3D perspective
        perspective: 900,
        cameraZ: -500,
        cameraX: 0,
        cameraY: 0,
        
        // Rendering
        lineAlpha: 0.4,
        dotRadius: 0.8,
        dotAlpha: 0.5,
        
        // Performance
        renderSkipDiag: 2,
    };

    let width, height, cols, rows;
    let particles = [];
    let springs = [];
    let mouse = { x: 0, y: 0, px: 0, py: 0, down: false, button: 0 };
    let grabbedParticle = null;
    let tornCount = 0;
    let totalSprings = 0;
    let animationId;
    let frameCount = 0;
    let lastFPSTime = performance.now();
    let displayFPS = 60;
    let WORLD_BOUNDS = { left: 0, right: 0, top: 0, bottom: 0 };

    // Pre-computed projection cache
    let projCache = null;

    // --- Resize ---
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // --- Particle ---
    class Particle {
        constructor(x, y, z, pinned = false) {
            this.x = x;
            this.y = y;
            this.z = z;
            this.ox = x;
            this.oy = y;
            this.oz = z;
            this.px = x;
            this.py = y;
            this.pz = z;
            this.pinned = pinned;
            this.idx = 0; // will be set after creation
        }

        update() {
            if (this.pinned) return;

            // Verlet integration
            let vx = (this.x - this.px) * CONFIG.damping;
            let vy = (this.y - this.py) * CONFIG.damping;
            let vz = (this.z - this.pz) * CONFIG.damping;

            this.px = this.x;
            this.py = this.y;
            this.pz = this.z;

            this.x += vx;
            this.y += vy + CONFIG.gravity;
            this.z += vz;

            // Clamp Z
            if (this.z < -400) this.z = -400;
            if (this.z > 400) this.z = 400;

            // Restore Z toward original
            this.z += (this.oz - this.z) * CONFIG.zRestoreForce;

            // Box collisions (left, right, top, bottom)
            const friction = 0.85; // slide friction along walls
            
            if (this.y > WORLD_BOUNDS.bottom) {
                this.y = WORLD_BOUNDS.bottom;
                this.py = this.y; // kill vertical velocity
                this.px = this.x - vx * friction; // apply friction to horizontal slide
            } else if (this.y < WORLD_BOUNDS.top) {
                this.y = WORLD_BOUNDS.top;
                this.py = this.y;
                this.px = this.x - vx * friction;
            }
            
            if (this.x > WORLD_BOUNDS.right) {
                this.x = WORLD_BOUNDS.right;
                this.px = this.x; // kill horizontal velocity
                this.py = this.y - vy * friction; // apply friction to vertical slide
            } else if (this.x < WORLD_BOUNDS.left) {
                this.x = WORLD_BOUNDS.left;
                this.px = this.x;
                this.py = this.y - vy * friction;
            }
        }

        // Project 3D to 2D (cached per frame)
        project() {
            const rawScale = CONFIG.perspective / (CONFIG.perspective - this.z + CONFIG.cameraZ);
            const scale = rawScale < 0.1 ? 0.1 : (rawScale > 3.0 ? 3.0 : rawScale);
            return {
                x: width * 0.5 + (this.x - width * 0.5 - CONFIG.cameraX) * scale,
                y: height * 0.5 + (this.y - height * 0.5 - CONFIG.cameraY) * scale,
                scale: scale
            };
        }
    }

    // --- Spring ---
    class Spring {
        constructor(a, b, stiffness, isDiag) {
            this.a = a;
            this.b = b;
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dz = a.z - b.z;
            this.restLength = Math.sqrt(dx * dx + dy * dy + dz * dz);
            this.stiffness = stiffness;
            this.torn = false;
            this.tearProgress = 0;
            this.isDiag = isDiag; // for rendering priority
        }

        solve() {
            if (this.torn) return;

            const dx = this.b.x - this.a.x;
            const dy = this.b.y - this.a.y;
            const dz = this.b.z - this.a.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            
            if (distSq < 0.0001) return;
            
            const dist = Math.sqrt(distSq);
            const stretchRatio = dist / this.restLength;

            // Tear progress for visual feedback
            if (stretchRatio > 1.5) {
                this.tearProgress = (stretchRatio - 1.5) / (CONFIG.tearDistance - 1.5);
                if (this.tearProgress < 0) this.tearProgress = 0;
                if (this.tearProgress > 1) this.tearProgress = 1;
            } else {
                this.tearProgress = 0;
            }

            if (stretchRatio > CONFIG.tearDistance) {
                this.torn = true;
                tornCount++;
                return;
            }

            const diff = (dist - this.restLength) / dist;
            const stiff = this.stiffness * 0.5;
            const ox = dx * diff * stiff;
            const oy = dy * diff * stiff;
            const oz = dz * diff * stiff;

            if (!this.a.pinned) {
                this.a.x += ox;
                this.a.y += oy;
                this.a.z += oz;
            }
            if (!this.b.pinned) {
                this.b.x -= ox;
                this.b.y -= oy;
                this.b.z -= oz;
            }
        }
    }

    // --- Initialize Grid ---
    function initGrid() {
        particles = [];
        springs = [];
        tornCount = 0;

        // Make the physical grid large enough to cover the screen at max zoom out (cameraZ = 1000)
        // At cameraZ = 1000, scale = 900 / (900 + 1000) = 0.473
        // So target width = width / 0.473 = width * 2.11. Let's use 2.2 for safety margin.
        const targetWorldWidth = width * 2.2;
        const targetWorldHeight = height * 2.2;

        let targetCols = Math.floor(targetWorldWidth / CONFIG.spacing) + 1;
        let targetRows = Math.floor(targetWorldHeight / CONFIG.spacing) + 1;
        
        let actualSpacing = CONFIG.spacing;

        // Limit for performance — cap total particles
        const maxParticles = 40000;
        if (targetCols * targetRows > maxParticles) {
            const ratio = Math.sqrt(maxParticles / (targetCols * targetRows));
            targetCols = Math.floor(targetCols * ratio);
            targetRows = Math.floor(targetRows * ratio);
            // Dynamically adjust spacing so it still covers the large physical area
            actualSpacing = targetWorldWidth / targetCols;
        }

        cols = targetCols;
        rows = targetRows;

        const startX = (width - (cols - 1) * actualSpacing) / 2;
        const startY = (height - (rows - 1) * actualSpacing) / 2;

        WORLD_BOUNDS.left = startX;
        WORLD_BOUNDS.right = startX + (cols - 1) * actualSpacing;
        WORLD_BOUNDS.top = startY;
        WORLD_BOUNDS.bottom = startY + (rows - 1) * actualSpacing;

        // Create particles
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const x = startX + col * actualSpacing;
                const y = startY + row * actualSpacing;
                const pinned = row === 0;
                const p = new Particle(x, y, 0, pinned);
                p.idx = particles.length;
                particles.push(p);
            }
        }

        // Create springs — structural (horizontal + vertical) + shear (diagonal)
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const idx = row * cols + col;
                
                // Right neighbor — structural
                if (col < cols - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + 1], CONFIG.stiffness, false));
                }
                // Bottom neighbor — structural
                if (row < rows - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + cols], CONFIG.stiffness, false));
                }
                // Diagonal (bottom-right) — shear
                if (col < cols - 1 && row < rows - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + cols + 1], CONFIG.shearStiffness, true));
                }
                // Diagonal (bottom-left) — shear
                if (col > 0 && row < rows - 1) {
                    springs.push(new Spring(particles[idx], particles[idx + cols - 1], CONFIG.shearStiffness, true));
                }
            }
        }

        totalSprings = springs.length;
        projCache = new Array(particles.length);
        
        console.log(`Grid: ${cols}x${rows} = ${particles.length} particles, ${springs.length} springs`);
    }

    // --- Un-project screen coords to world coords at given Z ---
    function unproject(screenX, screenY, z) {
        const scale = CONFIG.perspective / (CONFIG.perspective - z + CONFIG.cameraZ);
        const safeScale = scale < 0.1 ? 0.1 : (scale > 3.0 ? 3.0 : scale);
        return {
            x: width * 0.5 + CONFIG.cameraX + (screenX - width * 0.5) / safeScale,
            y: height * 0.5 + CONFIG.cameraY + (screenY - height * 0.5) / safeScale
        };
    }

    // --- Mouse Interaction ---
    function applyMouseForce() {
        const mouseDx = mouse.x - mouse.px;
        const mouseDy = mouse.y - mouse.py;

        // GRAB: click+hold drags the grabbed particle
        if (mouse.down && grabbedParticle) {
            const p = grabbedParticle;
            if (!p.pinned) {
                const world = unproject(mouse.x, mouse.y, p.z);
                // Clamp grab to physical world bounds so we can't drag it outside the box
                p.x = Math.max(WORLD_BOUNDS.left, Math.min(WORLD_BOUNDS.right, world.x));
                p.y = Math.max(WORLD_BOUNDS.top, Math.min(WORLD_BOUNDS.bottom, world.y));
            }
        }

        // PUSH/PULL: always active on hover (no click needed)
        const radiusSq = CONFIG.mouseRadius * CONFIG.mouseRadius;
        const invRadius = 1.0 / CONFIG.mouseRadius;
        
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (p.pinned || p === grabbedParticle) continue;

            const proj = p.project();
            const dx = proj.x - mouse.x;
            const dy = proj.y - mouse.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < radiusSq) {
                const dist = Math.sqrt(distSq);
                const t = 1 - dist * invRadius;
                const smoothForce = t * t * (3 - 2 * t) * CONFIG.mouseStrength;

                p.x += mouseDx * smoothForce * 0.18;
                p.y += mouseDy * smoothForce * 0.18;
                p.z += mouseDy * smoothForce * 0.35;
            }
        }
    }

    // --- Find nearest particle ---
    function findNearestParticle(mx, my) {
        let nearest = null;
        let nearestDist = Infinity;
        const maxDistSq = 2500; // 50px search radius

        for (const p of particles) {
            const proj = p.project();
            const dx = proj.x - mx;
            const dy = proj.y - my;
            const dist = dx * dx + dy * dy;
            if (dist < nearestDist && dist < maxDistSq) {
                nearestDist = dist;
                nearest = p;
            }
        }
        return nearest;
    }

    // --- Physics Step with substeps ---
    function physicsStep() {
        // Apply mouse force ONCE per frame before physics so constraints and bounds can resolve it
        applyMouseForce();

        for (let sub = 0; sub < CONFIG.substeps; sub++) {
            // Constraint solver — multiple iterations for stability
            for (let iter = 0; iter < CONFIG.constraintIters; iter++) {
                for (let i = 0; i < springs.length; i++) {
                    springs[i].solve();
                }
            }
            
            // Integrate particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
        }
    }

    // --- Rendering ---
    // Pre-compute all projections once per frame
    function computeProjections() {
        for (let i = 0; i < particles.length; i++) {
            projCache[i] = particles[i].project();
        }
    }

    function render() {
        ctx.clearRect(0, 0, width, height);

        // Compute projections
        computeProjections();

        // --- Draw springs (lines) ---
        // Batch by approximate color to reduce state changes
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Draw structural springs only (skip diagonals for clean wire grid look)
        for (let i = 0; i < springs.length; i++) {
            const s = springs[i];
            if (s.torn) continue;
            if (s.isDiag) continue; // Don't render diagonals — they're structural only

            const aIdx = s.a.idx;
            const bIdx = s.b.idx;
            const a = projCache[aIdx];
            const b = projCache[bIdx];

            // Quick frustum culling
            if (a.x < -20 && b.x < -20) continue;
            if (a.x > width + 20 && b.x > width + 20) continue;
            if (a.y < -20 && b.y < -20) continue;
            if (a.y > height + 20 && b.y > height + 20) continue;

            // Depth-based alpha
            const avgZ = (s.a.z + s.b.z) * 0.5;
            const depthFade = 1 - Math.abs(avgZ) * 0.0025;
            const dFade = depthFade < 0.08 ? 0.08 : (depthFade > 1 ? 1 : depthFade);
            
            const minScale = a.scale < b.scale ? a.scale : b.scale;
            let alpha = CONFIG.lineAlpha * minScale * dFade;

            let r = 200, g = 210, bCol = 225; // Slight cool steel tone

            // Stretch coloring
            if (s.tearProgress > 0) {
                r = 255;
                g = Math.floor(200 * (1 - s.tearProgress * 0.85));
                bCol = Math.floor(180 * (1 - s.tearProgress));
                alpha += s.tearProgress * 0.4;
            }

            // Depth-based color shift — closer = brighter, further = darker blue
            if (avgZ > 0) {
                // Coming toward camera
                const zBoost = avgZ * 0.001;
                r = Math.min(255, r + Math.floor(55 * zBoost));
                g = Math.min(255, g + Math.floor(45 * zBoost));
                bCol = Math.min(255, bCol + Math.floor(30 * zBoost));
            } else {
                // Going away
                const zDim = Math.abs(avgZ) * 0.001;
                r = Math.max(80, r - Math.floor(80 * zDim));
                g = Math.max(90, g - Math.floor(70 * zDim));
                bCol = Math.max(120, bCol - Math.floor(40 * zDim));
            }

            if (alpha < 0.02) continue;
            if (alpha > 0.9) alpha = 0.9;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(${r},${g},${bCol},${alpha.toFixed(3)})`;
            ctx.lineWidth = 0.4 * minScale;
            if (ctx.lineWidth < 0.15) ctx.lineWidth = 0.15;
            if (ctx.lineWidth > 1.8) ctx.lineWidth = 1.8;
            ctx.stroke();
        }

        // --- Draw intersection dots (every Nth for performance) ---
        const dotStep = 4; // Draw every 4th node for performance
        for (let row = 0; row < rows; row += dotStep) {
            for (let col = 0; col < cols; col += dotStep) {
                const i = row * cols + col;
                if (i >= particles.length) continue;
                
                const p = particles[i];
                const proj = projCache[i];

                if (proj.x < -30 || proj.x > width + 30 || proj.y < -30 || proj.y > height + 30) continue;

                const depthFade = 1 - Math.abs(p.z) * 0.0025;
                const dFade = depthFade < 0.08 ? 0.08 : depthFade;
                let alpha = CONFIG.dotAlpha * proj.scale * dFade;

                let radius = CONFIG.dotRadius * proj.scale;
                let color = '200, 210, 225';

                if (p.pinned) {
                    color = '100, 180, 255';
                    alpha *= 1.5;
                    if (alpha > 1) alpha = 1;
                    radius *= 1.3;
                }

                // Near-mouse highlight
                if (mouse.down) {
                    const dx = proj.x - mouse.x;
                    const dy = proj.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.mouseRadius) {
                        const influence = 1 - dist / CONFIG.mouseRadius;
                        const smoothInf = influence * influence * (3 - 2 * influence);
                        alpha += smoothInf * 0.4;
                        if (alpha > 1) alpha = 1;
                        radius += smoothInf * 1.5;

                        // Subtle glow
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, radius * 4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(100, 200, 255, ${smoothInf * 0.05})`;
                        ctx.fill();
                    }
                }

                ctx.beginPath();
                ctx.arc(proj.x, proj.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color}, ${alpha.toFixed(3)})`;
                ctx.fill();
            }
        }

        // Mouse cursor glow
        if (mouse.down) {
            const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, CONFIG.mouseRadius);
            glow.addColorStop(0, 'rgba(80, 160, 255, 0.07)');
            glow.addColorStop(0.4, 'rgba(80, 160, 255, 0.03)');
            glow.addColorStop(1, 'rgba(80, 160, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, CONFIG.mouseRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastFPSTime >= 1000) {
            displayFPS = Math.round(frameCount * 1000 / (now - lastFPSTime));
            frameCount = 0;
            lastFPSTime = now;
        }

        // Update stats
        document.getElementById('stat-springs').textContent = `GRID: ${cols}×${rows}`;
        document.getElementById('stat-torn').textContent = `TORN: ${tornCount}`;
        document.getElementById('stat-fps').textContent = `FPS: ${displayFPS}`;
    }

    // --- Animation Loop ---
    function animate() {
        physicsStep();
        render();
        animationId = requestAnimationFrame(animate);
    }

    // --- Event Handlers ---
    canvas.addEventListener('mousedown', (e) => {
        mouse.down = true;
        mouse.button = e.button;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.px = e.clientX;
        mouse.py = e.clientY;

        // Always grab the nearest particle on click
        grabbedParticle = findNearestParticle(mouse.x, mouse.y);

        document.getElementById('title').classList.add('fade-out');
        document.getElementById('instructions').classList.add('fade-out');
    });

    canvas.addEventListener('mousemove', (e) => {
        mouse.px = mouse.x;
        mouse.py = mouse.y;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    canvas.addEventListener('mouseup', () => {
        mouse.down = false;
        grabbedParticle = null;
    });

    canvas.addEventListener('mouseleave', () => {
        mouse.down = false;
        grabbedParticle = null;
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouse.down = true;
        mouse.x = touch.clientX;
        mouse.y = touch.clientY;
        mouse.px = touch.clientX;
        mouse.py = touch.clientY;

        // Always grab nearest particle on touch
        grabbedParticle = findNearestParticle(mouse.x, mouse.y);

        document.getElementById('title').classList.add('fade-out');
        document.getElementById('instructions').classList.add('fade-out');
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouse.px = mouse.x;
        mouse.py = mouse.y;
        mouse.x = touch.clientX;
        mouse.y = touch.clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
        mouse.down = false;
        grabbedParticle = null;
    });

    // Scroll to adjust camera distance (zoom in/out) without losing state
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        
        // Calculate scale before zoom (at z=0)
        const scaleBefore = CONFIG.perspective / (CONFIG.perspective + CONFIG.cameraZ);
        
        // Adjust cameraZ (zoom)
        CONFIG.cameraZ = Math.max(-600, Math.min(1000, CONFIG.cameraZ + e.deltaY * 1.5));
        
        // Calculate scale after zoom (at z=0)
        const scaleAfter = CONFIG.perspective / (CONFIG.perspective + CONFIG.cameraZ);
        
        // Adjust cameraX and cameraY to keep the point under the mouse stationary
        const mx = mouse.x - width * 0.5;
        const my = mouse.y - height * 0.5;
        
        CONFIG.cameraX += mx * (1 / scaleBefore - 1 / scaleAfter);
        CONFIG.cameraY += my * (1 / scaleBefore - 1 / scaleAfter);
        
        // Add gentle limits to camera panning so it doesn't get lost in space
        const maxPanX = width * 1.5;
        const maxPanY = height * 1.5;
        CONFIG.cameraX = Math.max(-maxPanX, Math.min(maxPanX, CONFIG.cameraX));
        CONFIG.cameraY = Math.max(-maxPanY, Math.min(maxPanY, CONFIG.cameraY));
    }, { passive: false });

    window.addEventListener('resize', () => {
        resize();
        initGrid();
    });

    function resetGrid() {
        CONFIG.cameraX = 0;
        CONFIG.cameraY = 0;
        CONFIG.cameraZ = -500;
        initGrid();
    }

    // Make functions global
    window.resetGrid = resetGrid;

    // --- Init ---
    resize();
    initGrid();
    animate();
    </script>
</body>
</html>
